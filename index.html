<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dad News</title>
  <meta name="description" content="A voice-controlled world news reader.">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dad News">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #0b1d3a;
      --fg: #ffffff;
      --muted: #c9d4e8;
      --accent: #ffd23f;
      --listen: #2ecc71;
      --busy: #4da3ff;
      --panel: #ffffff;
      --panel-fg: #111111;
      --border: #8a97ad;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #talk {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 24px 16px calc(72px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    #talk:focus-visible { outline: 6px solid var(--accent); outline-offset: -12px; }
    .ring {
      width: min(62vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 10px solid var(--accent);
      display: grid;
      place-items: center;
      transition: border-color .2s, transform .2s;
    }
    .ring svg { width: 45%; height: 45%; fill: var(--accent); transition: fill .2s; }
    body[data-state="listening"] .ring { border-color: var(--listen); transform: scale(1.06); }
    body[data-state="listening"] .ring svg { fill: var(--listen); }
    body[data-state="thinking"] .ring,
    body[data-state="speaking"] .ring { border-color: var(--busy); }
    body[data-state="thinking"] .ring svg,
    body[data-state="speaking"] .ring svg { fill: var(--busy); }
    body[data-state="thinking"] .ring { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.94); } }
    #status { font-size: clamp(28px, 7vw, 44px); font-weight: 700; text-align: center; line-height: 1.2; }
    #heard { font-size: clamp(18px, 4.5vw, 24px); color: var(--muted); text-align: center; min-height: 1.4em; max-width: 36ch; }

    #settings-link {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 2;
      color: var(--muted);
      font-size: 15px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    #setup {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow-y: auto;
      background: var(--panel);
      color: var(--panel-fg);
      padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
      -webkit-user-select: text;
      user-select: text;
    }
    #setup[hidden] { display: none; }
    #setup .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    #setup h1 { margin: 0; font-size: 26px; }
    #setup p { margin: 0; line-height: 1.45; }
    #setup label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
    #setup input, #setup select {
      font: inherit;
      font-size: 17px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: #111;
      width: 100%;
    }
    #setup .hint { font-weight: 400; font-size: 14px; color: #444; }
    #setup .row { display: flex; gap: 12px; flex-wrap: wrap; }
    #setup button {
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 10px;
      border: 0;
      background: var(--bg);
      color: #fff;
      flex: 1 1 140px;
    }
    #setup button.secondary { background: #e6e9ef; color: #111; }
    #setup-msg { min-height: 1.4em; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --panel: #15171c;
        --panel-fg: #f2f2f2;
        --border: #4b5263;
      }
      :root:not([data-theme="light"]) #setup input,
      :root:not([data-theme="light"]) #setup select { background: #1f232b; color: #f2f2f2; }
      :root:not([data-theme="light"]) #setup .hint { color: #b5bccb; }
      :root:not([data-theme="light"]) #setup button.secondary { background: #2a2f3a; color: #f2f2f2; }
    }
    :root[data-theme="dark"] {
      --panel: #15171c;
      --panel-fg: #f2f2f2;
      --border: #4b5263;
    }
  </style>
</head>
<body data-state="idle">
  <button id="talk" type="button" aria-label="Tap to talk to the news reader">
    <span class="ring" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
    </span>
    <span id="status">Tap anywhere and speak</span>
    <span id="heard"></span>
  </button>

  <button id="settings-link" type="button">Setup</button>

  <section id="setup" hidden aria-labelledby="setup-title">
    <div class="wrap">
      <h1 id="setup-title">Dad News setup</h1>
      <p>This screen is for family. The key is saved only on this phone. It is never uploaded to GitHub.</p>

      <label>Gemini API key
        <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza...">
        <span class="hint">Free, from aistudio.google.com → Get API key.</span>
        <span class="hint" id="used"></span>
      </label>

      <label>Language
        <select id="lang">
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="fr-FR">French</option>
          <option value="es-ES">Spanish</option>
          <option value="pt-PT">Portuguese</option>
          <option value="de-DE">German</option>
          <option value="ar-SA">Arabic</option>
          <option value="sw-KE">Swahili</option>
        </select>
      </label>

      <label>Speaking speed
        <input id="rate" type="range" min="0.6" max="1.4" step="0.05">
        <span class="hint">Dad can also say "slower" or "faster".</span>
      </label>

      <p id="setup-msg" role="status"></p>
      <div class="row">
        <button id="save" type="button">Save</button>
        <button id="test" type="button" class="secondary">Test voice</button>
        <button id="close" type="button" class="secondary">Close</button>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
