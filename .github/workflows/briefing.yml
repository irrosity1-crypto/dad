name: News briefing

on:
  schedule:
    # Checks every hour; the script only calls Claude when a reading time in
    # schedule.json is less than about an hour away.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make a briefing right now, ignoring the schedule"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node scripts/briefing.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force }}
      - name: Save briefing
        run: |
          git config user.name "dad-news-bot"
          git config user.email "dad-news-bot@users.noreply.github.com"
          mkdir -p briefings
          git add briefings
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "News briefing"
            git push
          fi
